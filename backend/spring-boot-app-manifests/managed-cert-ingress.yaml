apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: getmyuri-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: getmyuri-static-ip
    networking.gke.io/managed-certificates: getmyuri-cert
spec:
  ingressClassName: gce  # ✅ THIS IS THE KEY FIX
  rules:
    - host: getmyuri.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: getmyuri-service
                port:
                  number: 80
    - host: www.getmyuri.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: getmyuri-service
                port:
                  number: 80
